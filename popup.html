<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="panel">
    <header>
      <div class="title-row">
        <span class="logo">&gt;_</span>
        <h1>RSD Proxy</h1>
      </div>
      <div id="status-pill" class="pill pill-off">
        <span class="pulse"></span>
        <span id="status-text">disconnected</span>
      </div>
    </header>

    <div class="divider"></div>

    <section class="controls">
      <div class="field">
        <span class="prompt">$</span>
        <input type="text" id="host" placeholder="host" spellcheck="false" autocomplete="off" />
      </div>
      <div class="field">
        <span class="prompt">:</span>
        <input type="number" id="port" placeholder="1080" min="1" max="65535" />
      </div>
      <div class="field">
        <span class="prompt">~</span>
        <input type="text" id="bypass" placeholder="bypass (optional)" spellcheck="false" autocomplete="off" />
      </div>
    </section>

    <div class="divider"></div>

    <section class="actions">
      <button id="apply" class="btn-primary">
        <span class="btn-icon">&#9654;</span>
        Connect
      </button>
      <button id="toggle" class="btn-toggle" aria-label="Toggle proxy">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </button>
    </section>

    <div id="error-bar" class="error-bar hidden">
      <span class="error-icon">!</span>
      <span id="error-msg"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
